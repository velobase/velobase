name: Container

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/container.yml"
      - "apps/api/**"
      - "packages/billing/**"
      - "scripts/test-container.sh"
      - "compose.yaml"
      - "compose.dev.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "openapi.json"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".dockerignore"
      - ".github/workflows/container.yml"
      - "apps/api/**"
      - "packages/billing/**"
      - "scripts/test-container.sh"
      - "compose.yaml"
      - "compose.dev.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "openapi.json"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test the container stack
        run: sh scripts/test-container.sh

      - name: Scan the runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: velobase:dev
          version: v0.74.0
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
