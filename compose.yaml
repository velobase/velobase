services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velobase
      POSTGRES_USER: velobase
      POSTGRES_PASSWORD: velobase
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velobase -d velobase"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - velobase-postgres:/var/lib/postgresql/data

volumes:
  velobase-postgres:
