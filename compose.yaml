name: velobase

x-velobase-image: &velobase-image ${VELOBASE_IMAGE:-ghcr.io/velobase/velobase:0.1.1}
x-velobase-environment: &velobase-environment
  DATABASE_URL: postgresql://velobase:velobase@postgres:5432/velobase
  VELOBASE_TENANT_ID: ${VELOBASE_TENANT_ID:-demo}
  VELOBASE_PROJECT_ID: ${VELOBASE_PROJECT_ID:-ai-video}

services:
  api:
    image: *velobase-image
    command: server
    environment:
      <<: *velobase-environment
      PORT: 3000
    ports:
      - "${VELOBASE_BIND_ADDRESS:-127.0.0.1}:${VELOBASE_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    image: *velobase-image
    command: migrate
    environment: *velobase-environment
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velobase
      POSTGRES_USER: velobase
      POSTGRES_PASSWORD: velobase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velobase -d velobase"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - velobase-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  velobase-postgres:
