services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://velobase:velobase@postgres:5432/velobase
      VELOBASE_TENANT_ID: demo
      VELOBASE_PROJECT_ID: ai-video
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velobase
      POSTGRES_USER: velobase
      POSTGRES_PASSWORD: velobase
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velobase -d velobase"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - velobase-postgres:/var/lib/postgresql/data

volumes:
  velobase-postgres:
